[game]
desc             = """
🎨 Авторский контент.
📈 Уникальные системы: Предыстории! Навыки, Цели отделов, лучшая бюрократия. Продуманные коды угроз и игровые режимы.
📚 Загляни на нашу вики 😏
🌟 Баланс ролевой игры и веселья – стань частью уникального сообщества!"""
lobbyenabled     = true
lobbyduration = 220
map_pool = "VanillaMapPool"
round_restart_time = 340
soft_max_players = 100
panic_bunker.enabled = false
#panic_bunker.disable_with_admins = true
#panic_bunker.enable_without_admins = true
#panic_bunker.show_reason = true
#panic_bunker.min_overall_minutes = 60
#panic_bunker.custom_reason = "В настоящий момент нет модераторов, а вы не наиграли достаточного количества минут (60) на нашем сервере."
contraband_examine = false
tdmroundend_enabled = true

[hub]
tags = "lang:ru,region:eu_e,rp:med"
advertise = true

[log]
path = "logs"
format = "log_%(date)s-%(time)s.txt"
