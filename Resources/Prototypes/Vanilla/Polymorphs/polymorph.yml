- type: polymorph
  id: CursedSkeleton
  configuration:
    entity: CursedSkeleton
    forced: true
    inventory: Transfer
    transferName: true
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: true
    polymorphSound: /Audio/Misc/narsie_rises.ogg
    exitPolymorphSound: /Audio/Misc/narsie_rises.ogg
    polymorphPopup: SkeletonCurse-popup

- type: entity
  parent: MobSkeletonPerson
  id: CursedSkeleton
  name: Проклятый скелет
  components:
  - type: SkeletonCurse
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Pacified
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:GibBehavior
