- type: entity
  parent: BaseSubdermalImplant
  id: MemoryShieldImplant
  name: memoryshield implant
  description: This implant protects the user's memory in case of clinical death.
  categories: [ HideSpawnMenu ]
  components:
   - type: SubdermalImplant
   - type: MemoryShieldImplant

- type: entity
  parent: BaseSubdermalImplant
  id: DefibrillatorImplant
  name: Имплант «Дефибриллятор»
  description: Имплант будет дефибриллировать сердце, если возможна реанимация.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
    implantComponents:
    - type: AutoDefibrillator
      zapHeal:
        types:
          Asphyxiation: -40


- type: entity
  parent: BaseSubdermalImplant
  id: NanoRobotsImplant
  name: Имплант нанороботов
  description: Этот имплант вводит в организм нанороботов, которые лечат тело носителя.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
    implantComponents:
    - type: PassiveDamage
      allowedStates:
      - Critical
      - Dead
      damage:
        types:
          Blunt: -0.5
          Piercing: -0.5
          Slash: -0.5
          Caustic: -0.15
          Radiation: -0.15
          Cellular: -0.15
          Asphyxiation: -1.5
          Bloodloss: -1.5
          Cold: -0.5
          Heat: -0.5
          Poison: -0.5
          Shock: -0.5
