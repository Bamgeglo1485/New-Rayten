#debug
- type: entity
  id: TraitorShopImplanter
  name: Имплантер трейторшопа
  parent: BaseImplantOnlyImplanter
  suffix: Debug, TTT
  components:
    - type: Implanter
      implant: TraitorShopImplant

- type: entity
  id: DetectiveShopImplanter
  name: Имплантер детективШопа
  parent: BaseImplantOnlyImplanter
  suffix: Debug, TTT
  components:
    - type: Implanter
      implant: DetectiveShopImplant

#end-debug
- type: entity
  parent: [ BaseSubdermalImplant, StorePresetTraitorShop ]
  id: TraitorShopImplant
  name: ТрейторШоп
  description: Закупка разных грязных штучек
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenTraitorShopImplant
  - type: Store
    balance:
      TTTCredit: 2
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: [ BaseSubdermalImplant, StorePresetDetectiveShop ]
  id: DetectiveShopImplant
  name: ДетективШоп
  description: Закупка разных хороших предметов
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenDetectiveShopImplant
    whitelist:
      components:
      - Hands
  - type: Store
    balance:
      TTTCredit: 1
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: BaseAction
  id: ActionOpenDetectiveShopImplant
  name: Открыть ДетективШоп
  description: Открыть магазин детектива
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Devices/communication.rsi
      state: old-radio
  - type: InstantAction
    event: !type:OpenUplinkImplantEvent

- type: entity
  parent: BaseAction
  id: ActionOpenTraitorShopImplant
  name: Открыть ТрейторШоп
  description: Открыть магазин предателя
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Devices/communication.rsi
      state: old-radio
  - type: InstantAction
    event: !type:OpenUplinkImplantEvent

- type: entity
  id: DisguiserImplanter
  name: Имплантер маскировщика
  parent: BaseImplantOnlyImplanter
  suffix: TTT
  components:
    - type: Implanter
      implant: DisguiserImplant

- type: entity
  parent: [ BaseSubdermalImplant, StorePresetTraitorShop ]
  id: DisguiserImplant
  name: Маскировщик
  description: Позволяет скрывать имя владельца
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionDisguiser

- type: entity
  parent: BaseToggleAction
  id: ActionDisguiser
  name: Cкрыть имя
  description: Заменяет ваше имя на "Неизвестный"
  components:
  - type: Action
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 1
    iconOn:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon-on
    icon:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon
    priority: 7
  - type: InstantAction
    event: !type:TTTDisguiserActionEvent

- type: entity
  id: TTTRadarImplanter
  name: Имплантер радара
  parent: BaseImplantOnlyImplanter
  suffix: TTT
  components:
  - type: Implanter
    implant: TTTRadarImplant

- type: entity
  parent: [ BaseSubdermalImplant, StorePresetTraitorShop ]
  id: TTTRadarImplant
  name: радар
  description: Показывает местоположение всех игроков 1 раз в 30 секунд
  categories: [ HideSpawnMenu ]
  components:
  - type: TTTRadar
  - type: SubdermalImplant
    implantAction: ActionTTTRadarOpen
  - type: UserInterface
    interfaces:
      enum.StationMapUiKey.Key:
        type: TTTRadarBoundUserInterface
        requireInputValidation: false

- type: entity
  parent: BaseMentalAction
  id: ActionTTTRadarOpen
  name: Открыть радар
  description: Открыть радар, который раз в 30 секунд показывает местоположение всех игроков.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/pai-map.rsi, state: icon }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.StationMapUiKey.Key
