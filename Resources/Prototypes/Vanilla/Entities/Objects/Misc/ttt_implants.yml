#debug
- type: entity
  id: TraitorShopImplanter
  name: Имплантер трейторшопа
  parent: BaseImplantOnlyImplanter
  suffix: Debug
  components:
    - type: Implanter
      implant: TraitorShopImplant
#end-debug
- type: entity
  parent: [ BaseSubdermalImplant, StorePresetTraitorShop ]
  id: TraitorShopImplant
  name: ТрейторШоп
  description: Закупка разных грязных штучек
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenTraitorShopImplant
  - type: Store
    balance:
      TTTCredit: 2
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: [ BaseSubdermalImplant, StorePresetDetectiveShop ]
  id: DetectiveShopImplant
  name: ДетективШоп
  description: Закупка разных хороших предметов
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenDetectiveShopImplant
    whitelist:
      components:
      - Hands
  - type: Store
    balance:
      TTTCredit: 1
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: BaseAction
  id: ActionOpenDetectiveShopImplant
  name: Открыть ДетективШоп
  description: Открыть магазин детектива
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Devices/communication.rsi
      state: old-radio
  - type: InstantAction
    event: !type:OpenUplinkImplantEvent

- type: entity
  parent: BaseAction
  id: ActionOpenTraitorShopImplant
  name: Открыть ТрейторШоп
  description: Открыть магазин предателя
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Devices/communication.rsi
      state: old-radio
  - type: InstantAction
    event: !type:OpenUplinkImplantEvent

- type: entity
  id: DisguiserImplanter
  name: Имплантер маскировщика
  parent: BaseImplantOnlyImplanter
  suffix: TTT
  components:
    - type: Implanter
      implant: DisguiserImplant

- type: entity
  parent: [ BaseSubdermalImplant, StorePresetTraitorShop ]
  id: DisguiserImplant
  name: Маскировщик
  description: Позволяет скрывать имя владельца
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionDisguiser


- type: entity
  parent: BaseToggleAction
  id: ActionDisguiser
  name: Cкрыть имя
  description: Заменяет ваше имя на "Неизвестный"
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 1
    iconOn:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon-on
    icon:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon
    priority: 7
  - type: InstantAction
    event: !type:TTTDisguiserActionEvent
