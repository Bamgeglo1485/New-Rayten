- type: entity
  name: мозговой червь
  parent:
  - BaseSimpleMob
  - MobAtmosExposed
  - MobBloodstream
  - MobFlammable
  id: MobBrainWorm
  description: УБЕРИТЕ ЕГО ОТ МЕНЯ, УБЕРИТЕ
  components:
  # спрайт
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Vanilla/Mobs/Animals/brainworm.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: brainworm
  - type: DamageStateVisuals
    states:
      Alive:
        Base: brainworm
      Critical:
        Base: brainworm_dead
      Dead:
        Base: brainworm_dead
  # радио
  - type: IntrinsicRadioTransmitter
    channels: [ BrainWorm ]
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels: [ BrainWorm ]
  # ночное зрение
  - type: NightVision
  - type: PointLight
    radius: 9
    energy: 1.5
    color: "#013220"
    enabled: false
    netsync: false
  # гостролька
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: Мозговой червь
    description: Вы должны выжить и размножиться.
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
  - type: Speech
  - type: Tag
    tags:
    - Trash
    - VimPilot
  # хп
  - type: Flammable
  - type: TemperatureProtection
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Dead
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -0.5
        Piercing: -0.5
        Slash: -0.5
        Poison: -0.5
        Radiation: -0.5
        Cellular: -0.5
        Asphyxiation: -0.5
        Bloodloss: -0.5
        Cold: -0.5
        Heat: -0.5
        Caustic: -0.5
        Shock: -0.5
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: BrainWorm
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.ChemicalsUiKey.Key:
        type: WormChemicalsBoundUserInterface
      enum.ForceSayUiKey.Key:
        type: WormForceSayBoundUserInterface
  - type: Store
    categories:
    - BrainWormAbilities
    - BrainWormEvolution
    - BrainWormHostUpgrades
    currencyWhitelist:
    - EvolutionPoints

- type: entity
  parent: BaseEntitySpellAction
  id: ActionInsertBrain
  name: Проникнуть в мозг
  description: Позволяет заползти в ухо и присосаться к мозгу.
  components:
  - type: Action
    priority: -99
  - type: TargetAction
    accessMask:
    - Opaque
    repeat: false
    range: 1
  - type: EntityTargetAction
    event: !type:InsertInBrainEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: insertbrain

- type: entity
  parent: BaseAction
  id: ActionMindControl
  name: Захватить разум носителя
  description: Позволяет взять под контроль тело носителя. Он всё ещё может освободиться.
  components:
  - type: Action
    useDelay: 15
    priority: -100
  - type: InstantAction
    event: !type:MindControlEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: mindcontrol

- type: entity
  parent: BaseAction
  id: ActionEjectBrain
  name: Отпустить носителя
  description: Вы покидаете тело носителя через ухо.
  components:
  - type: Action
    priority: -99
  - type: InstantAction
    event: !type:EjectBrainEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: ejectbrain

- type: entity
  parent: BaseAction
  id: ActionBrainWormChemicals
  name: Выделить реагенты
  description: ввести в кровь носителя химикаты
  components:
  - type: Action
    priority: -98
  - type: InstantAction
    event: !type:BrainWormChemicalsActionEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: chemicals

- type: entity
  parent: BaseAction
  id: ActionBrainWormShop
  name: Эволюция
  description: получение новых способностей
  components:
  - type: Action
    priority: -97
  - type: InstantAction
    event: !type:BrainWormShopActionEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: evolution

- type: entity
  parent: BaseAction
  id: ActionBrainWormReturnControl
  name: Вернуть контроль
  description: Вернуть носителю контроль над собственным телом
  components:
  - type: Action
    priority: -98
  - type: InstantAction
    event: !type:BrainWormReturnControlActionEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: returncontrol

- type: entity
  parent: BaseAction
  id: ActionBrainWormReproduce
  name: Размножиться
  description: Носитель выблевывает нового мозгового червя.
  components:
  - type: Action
    priority: -99
  - type: InstantAction
    event: !type:BrainWormReproduceEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: reproduce

- type: entity
  parent: BaseAction
  id: ActionBrainWormForceSay
  name: Заставить носителя говорить
  description: Заставьте носителя сказать какую-то несусветную чушь, которая взбредет в ваш паразитический ум.
  components:
  - type: Action
  - type: InstantAction
    event: !type:BrainWormForceSayActionEvent
  - type: Sprite
    sprite: Vanilla/Interface/Actions/brainworm.rsi
    state: mindcontrol
