- type: entity
  name: проволочная фигурка
  id: MobWireFigurineArchon068
  parent:
  - BaseSimpleMob
  - BaseMobAnimal
  description: представляет собой плоскую проволочную фигурку, сделанную из неизвестного металла.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/mouse.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mouse-0
  - type: WireFigurine
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: NpcFactionMember
    factions:
      - Mouse
  - type: HTN
    rootTask:
      task: 068Compound
    blackboard:
      FollowRange: !type:Single
        1.5
