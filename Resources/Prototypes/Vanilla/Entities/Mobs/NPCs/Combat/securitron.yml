- type: htnCompound
  id: KillDangerMobsCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatDangermobCompound

# расстрел всех кто жив и представляет опасность
- type: htnCompound
  id: GunCombatDangermobCompound
  branches:
    - tasks:
        # Ищем опасную цель (только живую сделать в будущем)
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyDangerMobTargets
        # бегаем за ней
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange
        # джукаем
        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        # сообщаем информацию
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:SpeakDatasetOperator
            dataset: SecuritonTargetWarning
            radio: true

        # стреляем
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyDangerMobTargets
              key: Target

        # сообщаем в рацию
        - !type:HTNPrimitiveTask
          operator: !type:SpeakDatasetOperator
            dataset: SecuritonTargetDead
            radio: true
        # и просто в чатик для фанчика
        - !type:HTNPrimitiveTask
          operator: !type:SpeakDatasetOperator
            dataset: SecuritonTargetDead
            hidden: true

- type: htnCompound
  id: SecuritronMeleeCompound
  branches:
    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PulledOperator
            key: Puller

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Puller
            - !type:TargetInRangePrecondition
              targetKey: Puller
              rangeKey: MovementRange
            - !type:TargetInLOSPrecondition
              targetKey: Puller
              rangeKey: MovementRange
          operator: !type:SingleMeleeAttackOperator
            targetKey: Puller

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInLOSPrecondition
              targetKey: Puller
              rangeKey: MovementRange
          operator: !type:UnPullOperator
            shutdownState: TaskFinished

        - !type:HTNPrimitiveTask
          operator: !type:SpeakDatasetOperator
            dataset: SecuritonPull
            hidden: true





