- type: entity
  parent: BaseWall
  id: WallPocketDimension
  name: гнилая масса
  description: Довольно противно.
  components:
    - type: Icon
      sprite: Structures/Walls/stone-chromite.rsi
      state: full
    - type: Sprite
      sprite: Structures/Walls/stone-chromite.rsi
    - type: IconSmooth
      key: walls
      mode: NoSprite
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          mask:
          - FullTileMask
          layer:
          - WallLayer
          density: 4000
    - type: Damageable
      damageModifierSet: StructuralMetallicStrong
    - type: RadiationBlocker
      resistance: 5

- type: entity
  parent: BaseWall
  id: SolidWallPocketDimension
  name: разложенная стена
  description: Выглядит как что-то, что можно сломать пальцем.
  components:
  - type: Sprite
    sprite: Structures/Walls/solid-rust.rsi
  - type: Icon
    sprite: Structures/Walls/solid-rust.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: solid

- type: entity
  parent: BaseWall
  id: SolidWallReinforcedPocketDimension
  name: разложенная стена
  description: Выглядит как что-то, что можно сломать пальцем.
  components:
  - type: Sprite
    sprite: Structures/Walls/solid-rust.rsi
  - type: Icon
    sprite: Structures/Walls/solid-rust.rsi
    state: rgeneric
  - type: IconSmooth
    key: walls
    base: reinf_over
