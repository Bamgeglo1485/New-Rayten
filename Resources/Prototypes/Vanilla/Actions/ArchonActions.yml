- type: entity
  parent: BaseAction
  id: Action173Scrug
  name: Сломать шею
  description: переместись за спину и свернуть шею в момент, когда никто не видит
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 10
    priority: -98
  - type: TargetAction
    interactOnMiss: false
    checkCanAccess: false # чекаем самостоятельно, т.к. нам важны собственные попупы
    range: 20
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    event: !type:ScragEvent
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: neck_snap

- type: entity
  parent: BaseAction
  id: Action173Teleport
  name: телепортироваться
  description: переместись в пространстве в момент, когда никто не видит
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 3
    priority: -99
  - type: TargetAction
    checkCanAccess: false # чекаем самостоятельно, т.к. нам важны собственные попупы
    range: 20
  - type: WorldTargetAction
    event: !type:SculptureTeleportEvent
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: teleport

- type: entity
  parent: BaseAction
  id: Action106Teleport
  name: Телепотироваться
  description: Переместиться в ваше карманное измерение либо обратно на станцию.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 120
    priority: -99
  - type: InstantAction
    event: !type:OldManTeleportEvent
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: teleport

- type: entity
  parent: BaseAction
  id: Action939Exo
  name: Эхолокация
  description: Увидеть всех, кто быстро передвигается
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 30
    priority: -99
  - type: InstantAction
    event: !type:WithManyVoicesExoEvent
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: echo

- type: entity
  parent: BaseAction
  id: Action049Surgery
  name: Провести операцию
  description: Провести хирургическую операцию над трупом уменьшив общий уровень поветрия.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 180
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Bloodstream
    canTargetSelf: false
    event: !type:Surgery049Event
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: surgery

- type: entity
  parent: BaseAction
  id: Action049MarkVictim
  name: Отметить жертву
  description: Кто-то вам сильно мешает? Отметьте его меткой для убийства! Увеличивает уровень поветрия на 20 ед.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 180
  - type: TargetAction
    interactOnMiss: false
    range: 18
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Bloodstream
      - PredatorVisibleMark
    canTargetSelf: false
    event: !type:MarkVictim049Event
  - type: Sprite
    sprite: Vanilla/Actions/Archon.rsi
    state: makevictim
