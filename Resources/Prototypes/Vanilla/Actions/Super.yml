- type: entity
  parent: BaseAction
  id: ActionBlueSpaceSyncSuper
  name: Блюспейс-ускорение
  description: I can't stop!
  components:
  - type: Action
    useDelay: 20
  - type: InstantAction
    event: !type:BlueSpaceSyncEvent {}
  - type: Sprite
    sprite: Interface/Actions/jump.rsi
    layers:
    - state: icon

- type: entity
  parent: BaseAction
  id: ActionFly
  name: Переключить полёт
  description: Это птица, это самолёт? Нет, это 2д космонавтик.
  components:
  - type: Action
    useDelay: 2
  - type: InstantAction
    event: !type:FlyActionEvent {}
  - type: Sprite
    sprite: Vanilla/Actions/Super.rsi
    layers:
    - state: fly
