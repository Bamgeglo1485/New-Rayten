# requires that the player kill someone only once
# disables social objectives and is disabled by social objectives

- type: entity
  abstract: true
  parent: BaseTargetObjective
  id: BaseTeachALessonObjective
  components:
  - type: Objective
    unique: false
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - SocialObjective
  - type: TeachALessonCondition

#Teach a Lesson
- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomPersonObjective
  description: Ваша цель не убить, а наказать. Убедитесь, что цель умрёт МУЧИТЕЛЬНО единожды. Он знает, что натворил.
  components:
  - type: Objective
    difficulty: 2 #slightly under 1/3rd the diffculty of RR
    unique: true
  - type: TargetObjective
    title: objective-condition-teach-lesson-title
  - type: PickRandomPerson
    conditions: []

- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomHeadObjective
  description: Ваша цель не убить, а наказать. Убедитесь, что цель умрёт МУЧИТЕЛЬНО единожды. Он знает, что натворил.
  components:
  - type: Objective
    # technically it's still possible for TeachRandomPersonObjective to roll a head but this is guaranteed, so higher difficulty
    difficulty: 2
    # killing 1 head is enough
    unique: true
  - type: TargetObjective
    title: objective-condition-teach-lesson-title
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff

- type: entity
  abstract: true
  parent: BaseTargetObjective
  id: BaseRPObjective
  components:
  - type: Objective
    unique: false
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
  - type: PickRandomPerson
    conditions: []
  - type: FreeObjective

- type: entity
  parent: [BaseTraitorObjective, BaseRPObjective]
  id: JailRPObjective
  description: Консорциум Защиты Прав Животных посчитал, что убивать цель - слишком жестоко. Подставьте и посадите его.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff
    difficulty: 2.0
    unique: true
  - type: TargetObjective
    title: objective-condition-jail-rp-title

- type: entity
  parent: [BaseTraitorObjective, BaseRPObjective]
  id: VerbRPObjective
  description: Его навыки и знания помогут нам. Попытайтесь завербовать его в Синдикат и дайте ему первое задание.
  components:
  - type: Objective
    difficulty: 2.0
    icon:
      sprite: _Funkystation/Effects/duo_emotes.rsi
      state: icon-handshake
    unique: true
  - type: TargetObjective
    title: objective-condition-verb-rp-title

- type: entity
  parent: [BaseTraitorObjective, BaseRPObjective]
  id: VerbEnrageObjective
  description: Синдикату нужна реклама в НТоке, так что взбесите главу, а мы вырежем это на короткие ролики.
  components:
  - type: Objective
    icon:
      sprite: _Funkystation/Effects/duo_emotes.rsi
      state: icon-fistbump
    difficulty: 2.0
    unique: true
  - type: TargetObjective
    title: objective-condition-enrage-rp-title
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff
