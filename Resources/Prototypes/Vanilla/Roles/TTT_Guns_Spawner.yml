- type: entity
  parent: RandomSpawner
  name: Спавнер случайного оружия
  id: TTTRandomGunSpawner
  suffix: TTT
  placement:
    mode: AlignTileAny
  components:
  - type: EntityTableSpawner
    offset: 0.2
    table: !type:NestedSelector
      tableId: TTTWeapon


- type: entityTable
  id: TTTWeapon
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      weight: 50
      tableId: TTTPistols
    - !type:NestedSelector
      weight: 100
      tableId: TTTGuns

# пистолеты
- type: entityTable
  id: TTTPistols
  table: !type:GroupSelector
    children:
    #редко
    - !type:GroupSelector
      weight: 20
      children:
      - id: WeaponRevolverDeckard
      - id: WeaponRevolverInspector
      - id: WeaponRevolverMateba
      - id: WeaponRevolverPython
    #обычно
    - !type:GroupSelector
      weight: 100
      children:
      - !type:NestedSelector
        tableId: TTTMK58
      - !type:NestedSelector
        tableId: TTTViper

- type: entityTable
  id: TTTMK58
  table: !type:AllSelector
    children:
    - id: WeaponPistolMk58
    - id: MagazinePistol
    - id: MagazinePistol
    - id: MagazineBoxPistol

- type: entityTable
  id: TTTViper
  table: !type:AllSelector
    children:
    - id: WeaponPistolViper
    - id: MagazinePistol
    - id: MagazinePistol
    - id: MagazineBoxPistol

# Основное оружие
- type: entityTable
  id: TTTGuns
  table: !type:GroupSelector
    children:
    #супер-редко
    - !type:GroupSelector
      weight: 10
      children:
      - !type:NestedSelector
        tableId: TTTAtreides
      - id: WeaponLightMachineGunL6
      - id: WeaponMinigun
      - id: WeaponHid
    #редко
    - !type:GroupSelector
      weight: 50
      children:
      - !type:NestedSelector
        tableId: TTTAKMS
      - !type:NestedSelector
        tableId: TTTDrozd
      - !type:NestedSelector
        tableId: TTTXL8
      - !type:NestedSelector
        tableId: TTTBuldog
      - !type:NestedSelector
        tableId: TTTEstoc
    #обычно
    - !type:GroupSelector
      weight: 100
      children:
      - !type:NestedSelector
        tableId: TTTLecter
      - !type:NestedSelector
        tableId: TTTM90
      - !type:NestedSelector
        tableId: TTTKammerer
      - !type:NestedSelector
        tableId: TTTEnforcer
      - !type:NestedSelector
        tableId: TTTDoubleBarreled
      - !type:NestedSelector
        tableId: TTTC20r
      - !type:NestedSelector
        tableId: TTTWT550

- type: entityTable
  id: TTTAKMS
  table: !type:AllSelector
