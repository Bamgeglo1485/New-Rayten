- type: entity
  id: TeamDeathMatch
  parent: BaseGameRule
  components:
  - type: TDMRule
  - type: TTTRule

- type: entity
  id: InstantRespawn
  parent: BaseGameRule
  components:
  - type: InstantRespawnRule

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseDiversionistRule
  components:
  - type: DiversionistRule
  - type: AntagRandomObjectives
    sets:
    - groups: DiversionistObjectiveGroups
    maxDifficulty: 5
  - type: AntagSelection
    agentName: roles-antag-diversionist-name
  - type: DynamicRuleCost
    cost: 100
  - type: AntagObjectives
    objectives:
    - DiversionistDemonstrateObjective

- type: entity
  parent: [ BaseDiversionistRule, BaseRoundstartAntagRule ]
  id: Diversionist
  components:
  - type: GameRule
    minPlayers: 0
    #delay:
      #min: 240
      #max: 420
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Diversionist
      range:
        min: 1
        max: 8

- type: entity
  parent: BaseDiversionistRule
  id: SleeperDiversionists
  components:
  - type: StationEvent
    weight: 8
    maxOccurrences: 1
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/Announcements/intercept.ogg
    duration: null
    occursDuringRoundEnd: false
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: Diversionist
      range:
        min: 1
        max: 2

